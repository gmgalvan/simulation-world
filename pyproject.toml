[project]
name = "simulation-world"
version = "0.1.0"
description = "Batalla 3D autónoma de helicópteros y tanques sobre un terreno procedural."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "panda3d>=1.10.16",
    "panda3d-gltf>=1.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
simulation-world = "simulation_world.simulation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulation_world"]
